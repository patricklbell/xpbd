<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>   
        body {
          padding: 0;
          margin: 0;
          height: 100vh;
          width: 100vw;
        }

        #container {
          display: flex;
          width: 100%;
          height: 100%;
          overflow: hidden;
        }
        
        #canvas {
            flex: 1;
            display: block;
            min-width: 0; /* Allow canvas to shrink below content size */
            min-height: 0;
            overflow: hidden;
        }
        
        #controls-container {
          flex: none;
          width: 300px;
          height: 100%;
          background: #f5f5f5;
          overflow: auto;
          padding: 20px;
          box-sizing: border-box;
        }

        @media  (max-width: 600px) {
          #container {
            flex-direction: column;
          }
          #controls-container {
            height: 300px;
            width: 100%;
          }
        }

        #controls {
          display: flex;
          flex-direction: column;
          gap: 10px;
          max-width: 300px;
        }

        .slider-container {
          display: flex;
          flex-direction: row;
          gap: 4px;
          align-items: center;
        }
        .slider-input {
          flex-grow: 1;
          min-width: 0;
        }
    </style>
</head>
<body>
  <div id="container">
    <canvas id="canvas"></canvas>
    <section id="controls-container">
      <h3>Controls:</h3>
      <ul>
        <li>Click an object and drag to move it.</li>
        <li>Drag left mouse to orbit around the scene.</li>
        <li>Drag right mouse to pan.</li>
        <li>Scroll to zoom the camera in and out.</li>
      </ul>
      <div id="controls"></div>
    </section>
  </div>
    {{{ SCRIPT }}}
</body>
</html>
